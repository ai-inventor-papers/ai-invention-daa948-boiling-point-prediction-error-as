[project]
name = "boiling_point_humidity_experiment"
version = "0.1.0"
description = "Testing Humidity Impact on Boiling Point - correlation analysis of boiling point prediction errors with relative humidity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "loguru==0.7.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"