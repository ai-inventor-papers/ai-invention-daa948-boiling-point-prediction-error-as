[project]
name = "boiling_point_validation"
version = "1.0.0"
description = "Empirical validation of ISA barometric formula and Antoine equation for boiling point prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "loguru==0.7.3",
    "matplotlib==3.10.7",
    "jsonschema==4.25.1",
    "pandas==2.3.3",
    "scipy==1.16.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]